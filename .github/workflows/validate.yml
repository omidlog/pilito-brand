name: validate

# CI design (same file in the template and in every brand repo; see the PR "ci: no hang, fast checks
# for brand-only changes"):
# - A brand repo checks the BRAND: lint, tokens, docs prep, typecheck, validate, docs build.
# - The brand test suite (`npm run test`, every tests/*.test.ts except tests/studio-*) runs only when
#   code or tooling changed; a brand-content-only change is covered by validate and the docs build.
# - The Studio suite (server, sync, provisioning, headless Chrome) runs only in the template repo,
#   where Studio is developed. Run it anywhere by hand with `npm run test:studio` / `npm run test:full`.
# - Never stuck: job timeout, per-test timeout and a whole-suite deadline in scripts/test.ts, and an
#   outdated run on the same PR/branch is cancelled when a newer one starts.
on:
  push:
    branches: [main] # other branches are checked through their pull request (no duplicate runs)
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung step must fail the job, not hold a runner for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Change scope, plain git and shell (no third-party actions). Brand content is brand/**, docs/**,
      # docs-internal/**, assets/**, top-level *.md and llms*.txt; any other changed path (scripts/**,
      # tests/**, apps/**, packages/**, package*.json, .github/**, tsconfig*, schemas/**, ...) is code
      # and turns the brand test suite on. If the base commit cannot be fetched (first push, force
      # push, manual run), the suite runs.
      - name: change scope
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ -n "$BASE" ] && ! echo "$BASE" | grep -qE '^0+$' && git fetch --quiet --no-tags --depth=1 origin "$BASE"; then
            changed=$(git diff --name-only "$BASE" HEAD)
            echo "changed files:"; echo "$changed" | sed 's/^/  /'
            other=$(echo "$changed" | grep -vE '^(brand|docs|docs-internal|assets)/|^[^/]+\.md$|^llms(-full)?\.txt$' || true)
            if [ -n "$changed" ] && [ -z "$other" ]; then code=false; fi
          else
            echo "base commit '$BASE' not available; treating the change as code"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code or tooling changed: $code"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # A private brand (brand.publish_docs: private) must never get a public docs build.
      # prepare-docs refuses one, so the public steps below run only for public brands.
      - name: read publish_docs
        id: docs
        run: echo "publish=$(node -e "console.log(require('yaml').parse(require('fs').readFileSync('brand/brand.config.yaml','utf8')).brand.publish_docs)")" >> "$GITHUB_OUTPUT"
      - run: npm run lint
      - run: npm run tokens:build
      - name: prepare docs (public)
        if: steps.docs.outputs.publish == 'public'
        run: npm run prepare:docs
      - name: prepare docs (internal, private brand)
        if: steps.docs.outputs.publish != 'public'
        run: npx tsx scripts/prepare-docs.ts --audience internal
      - run: npm run typecheck
      - run: npm run validate
      - name: brand tests (code or tooling changes only)
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 10
        run: npm run test
      # Studio is developed and tested in the template; brand repos never run its suite in CI.
      # ubuntu-latest ships Google Chrome, so no browser download is needed.
      - name: Studio tests (template repo only)
        if: github.repository == 'omidlog/brand-os-template'
        timeout-minutes: 12
        run: npm run test:studio
      - name: public docs build and scan
        if: steps.docs.outputs.publish == 'public'
        run: |
          npm run build -w @brand-os/docs
          npx tsx scripts/scan-public.ts apps/docs/build
          npm run build:docs:nomascot
          npx tsx scripts/scan-public.ts apps/docs/build
      # The internal audience (drafts, internal Brand Book, review dashboard) must compile too.
      # It is never deployed and is not scanned as public.
      - name: internal docs build compiles
        run: npx tsx scripts/prepare-docs.ts --audience internal && npm run build -w @brand-os/docs
