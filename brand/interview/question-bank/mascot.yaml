    module: mascot-expression
    field_path: brand.mascot.situation_map
    label: Situation map
    prompt:
      en: Which product situations need a character reaction first?
      fa: کدام موقعیت‌های محصول اول به واکنش شخصیت نیاز دارند؟
      tr: Hangi ürün durumları önce bir karakter tepkisi ister?
