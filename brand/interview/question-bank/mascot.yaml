schema_version: 1
questions:
  - id: brand.mascot.enabled
    module: mascot-identity
    field_path: brand.mascot.enabled
    label: Mascot
    prompt:
      en: Will this brand use a mascot or recurring character?
      fa: آیا این برند از یک مسکات یا شخصیت تکرارشونده استفاده می‌کند؟
      tr: Bu marka bir maskot veya tekrarlayan karakter kullanacak mı?
    why_it_matters: A no here removes mascot questions and hides the module. It does not delete the
      catalog from the template.
    question_type: boolean
    examples:
      - "EXAMPLE ONLY: no"
    suggestions:
      - yes
      - no
    required_when: always
    depends_on: []
    priority: critical
    order: 8
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: &a1
      - owner
      - approved_import
      - external_cited
      - agent_suggestion
    related_outputs:
      - brand/generated/drafts/mascot-identity.md
    related_ids: []
    completion_rule: boolean
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.mascot.role
    module: mascot-identity
    field_path: brand.mascot.role
    label: Character role
    prompt:
      en: What job does the character do in the brand?
      fa: شخصیت در برند چه کاری انجام می‌دهد؟
      tr: Karakter markada hangi işi yapar?
    why_it_matters: A role limits where the character appears.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: A guide for empty states. Not a spokesperson for legal claims."
    required_when: answers[brand.mascot.enabled] == yes
    skip_when: config.modules.mascot == false
    depends_on:
      - brand.mascot.enabled
    priority: high
    order: 400
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/mascot-identity.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.mascot.personality
    module: mascot-identity
    field_path: brand.mascot.personality
    label: Character personality
    prompt:
      en: Which character traits extend the brand personality, and which are forbidden?
      fa: کدام ویژگی‌های شخصیت، شخصیت برند را گسترش می‌دهند و کدام ممنوع‌اند؟
      tr: Hangi karakter özellikleri marka kişiliğini genişletir ve hangileri yasaktır?
    why_it_matters: The character is not a second brand.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Curious, never mean. Must still match the brand traits once those exist."
    required_when: always
    skip_when: config.modules.mascot == false
    depends_on:
      - brand.mascot.enabled
      - brand.personality.traits
    priority: high
    order: 401
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
