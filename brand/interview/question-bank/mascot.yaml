  - id: brand.mascot.transition
    module: mascot-evolution
    field_path: brand.mascot.transition
    label: Transition
    prompt:
      en: How should a stage change move, including reduced motion?
      fa: تغییر مرحله، از جمله با حرکت کم، چگونه حرکت کند؟
      tr: Bir aşama değişimi, azaltılmış hareket dahil, nasıl hareket etsin?
    why_it_matters: Motion and accessibility are part of evolution, not a later polish pass.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Crossfade. Reduced motion shows the new still immediately."
    required_when: always
    skip_when: config.modules.mascot == false
