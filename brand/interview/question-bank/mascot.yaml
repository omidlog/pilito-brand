  - id: brand.mascot.forbidden
    module: mascot-identity
    field_path: brand.mascot.forbidden
    label: Forbidden distortions
    prompt:
      en: Which distortions are always forbidden?
      fa: کدام تحریف‌ها همیشه ممنوع‌اند؟
      tr: Hangi bozulmalar her zaman yasak?
    why_it_matters: The bible needs a no list before production volume grows.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: No extra limbs, no copied characters, no unsafe stereotypes."
    required_when: always
