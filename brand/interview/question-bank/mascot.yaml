  - id: brand.mascot.stage_story
    module: mascot-evolution
    field_path: brand.mascot.stage_story
    label: Stage story
    prompt:
      en: If there is more than one stage, what changes visually, and what must stay recognizable?
      fa: اگر بیش از یک مرحله هست، از نظر بصری چه تغییر می‌کند و چه چیزی باید قابل تشخیص بماند؟
      tr: Birden fazla aşama varsa görsel olarak ne değişir ve ne tanınır kalmalı?
    why_it_matters: Evolution without continuity rules produces a different character.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Not applicable at one stage. The egg-to-captain list is only an example
        configuration."
    required_when: always
    skip_when: config.modules.mascot == false
    depends_on:
