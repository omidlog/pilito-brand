  - id: brand.mascot.angles
    module: mascot-expression
    field_path: brand.mascot.angles
    label: Angle priority
    prompt:
      en: Which of the eight canonical angles are required for the first approved sheet?
      fa: از هشت زاویهٔ canonical، کدام‌ها برای اولین شیت تأییدشده لازم‌اند؟
      tr: Sekiz kanonik açıdan hangileri ilk onaylı pafta için gerekli?
    why_it_matters: Asking for eight angles on day one stalls brands that only need a front view.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Front and front-left three-quarter first. The other six stay defined but
        unproduced."
    required_when: always
