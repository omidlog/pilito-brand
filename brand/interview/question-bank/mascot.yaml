    module: mascot-evolution
    field_path: brand.mascot.continuity
    label: Continuity
    prompt:
      en: Which marks, proportions, or props must survive every stage?
      fa: کدام نشانه‌ها، تناسب‌ها یا ابزارها باید در هر مرحله بمانند؟
      tr: Hangi işaretler, oranlar veya gereçler her aşamada kalmalı?
    why_it_matters: Recognition is a brand requirement, not a drawing habit.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: TBD until a model sheet exists."
    required_when: always
