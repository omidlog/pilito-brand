  - id: brand.mascot.unlocks
    module: mascot-evolution
    field_path: brand.mascot.unlocks
    label: Unlock placeholder
    prompt:
      en: Should stage changes be tied to product progress? If yes, leave the mechanic as a placeholder,
        not a number.
      fa: آیا تغییر مرحله به پیشرفت محصول وصل شود؟ اگر بله، مکانیک را جای‌نگهدار بگذارید نه یک عدد.
      tr: Aşama değişimi ürün ilerlemesine bağlansın mı? Evetse mekaniği sayı değil yer tutucu bırakın.
    why_it_matters: The spec forbids invented game economics.
    question_type: long_text
    examples:
