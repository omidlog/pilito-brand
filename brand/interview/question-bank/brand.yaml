  - id: brand.logo.misuse
    module: logo-system
    field_path: brand.logo.misuse
    label: Misuse rules
    prompt:
      en: Which logo misuses are already forbidden, even before a final mark?
      fa: حتی قبل از نشانهٔ نهایی، کدام سوءاستفاده‌ها از لوگو ممنوع است؟
      tr: Son işaretten önce bile hangi logo kötü kullanımları yasak?
