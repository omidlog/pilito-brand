  - id: brand.verbal.voice_pairs
    module: verbal-identity
    field_path: brand.verbal.voice_pairs
    label: Voice do and don’t
    prompt:
      en: "Give two to five do/don’t pairs for the voice, one per line: what to write | what not to
        write."
      fa: "دو تا پنج جفت «انجام بده / انجام نده» برای لحن بنویسید، هر جفت در یک خط: چه بنویسیم | چه
        ننویسیم."
      tr: "Ses için iki ila beş yap/yapma çifti yazın, her satıra bir tane: ne yazılır | ne yazılmaz."
    why_it_matters: Paired examples are the fastest way for a writer or an agent to hear the voice. The
      Brand Book shows them side by side.
    question_type: voice_pairs
    examples:
      - "EXAMPLE ONLY: Say what happened and what to do next | Blame the user for an error; Use the
        learner’s words | Use internal jargon"
    required_when: always
    depends_on:
      - brand.personality.traits
    priority: high
    order: 67
    sensitivity: internal
    language:
