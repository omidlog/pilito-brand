  - id: brand.verbal.voice
    module: verbal-identity
    field_path: brand.verbal.voice
    label: Tone of voice
    prompt:
      en: How should the brand sound in a normal product sentence, and how should it sound in an error?
      fa: برند در یک جملهٔ عادی محصول و در یک خطا چگونه صدا بدهد؟
      tr: Marka normal bir ürün cümlesinde ve bir hatada nasıl duyulsun?
    why_it_matters: Channel tone adapts a base voice. Errors are where brands usually break character.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Plain and specific. Errors say what happened and what to do next.
        Illustration only."
    required_when: always
    depends_on:
