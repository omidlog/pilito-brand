  - id: brand.logo.variants
    module: logo-system
    field_path: brand.logo.variants
    label: Variants needed
    prompt:
      en: Which logo variants do you expect to need? “None yet” is a complete answer.
      fa: انتظار دارید به کدام نسخه‌های لوگو نیاز داشته باشید؟ «هنوز هیچ» یک پاسخ کامل است.
      tr: Hangi logo çeşitlerine ihtiyacınız olacağını düşünüyorsunuz? “Henüz yok” tam bir yanıttır.
    why_it_matters: A variant list scopes the designer. It does not invent artwork.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: None yet. A wordmark may be needed later."
    required_when: always
