    module: verbal-identity
    field_path: brand.verbal.microcopy
    label: Microcopy principle
    prompt:
      en: What is the rule for buttons, empty states, and notifications?
      fa: قاعدهٔ دکمه‌ها، حالت‌های خالی و اعلان‌ها چیست؟
      tr: Düğmeler, boş durumlar ve bildirimler için kural nedir?
    why_it_matters: Product UI copy should not invent a second voice.
    question_type: long_text
