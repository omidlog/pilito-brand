  - id: brand.strategy.decision_rule
    module: brand-strategy
    field_path: brand.strategy.decision_rule
    label: Decision rule
    prompt:
      en: What rule should a teammate use to accept or reject a brand idea?
      fa: هم‌تیمی با چه قاعده‌ای یک ایدهٔ برند را بپذیرد یا رد کند؟
      tr: Bir ekip arkadaşı bir marka fikrini hangi kuralla kabul veya reddetsin?
    why_it_matters: Governance needs a rule before the asset library fills up.
    question_type: long_text
    examples:
