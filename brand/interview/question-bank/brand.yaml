      en: How is the trade name spelled, pronounced, and never altered?
      fa: نام تجاری چگونه نوشته، تلفظ و هرگز تغییر داده نشود؟
      tr: Ticari ad nasıl yazılır, söylenir ve asla nasıl değiştirilmez?
