  - id: brand.identity.public_name_override
    module: verbal-identity
    field_path: brand.identity.public_name_override
    label: Public name override
    prompt:
      en: If the public brand name differs from the trade name, what is it? Answer same if it does not
        differ.
      fa: اگر نام عمومی برند با نام تجاری فرق دارد، چیست؟ اگر فرق ندارد، same.
      tr: Herkese açık marka adı ticari addan farklıysa nedir? Farklı değilse same yazın.
    why_it_matters: Two names are allowed only when the difference is intentional.
    question_type: short_text
