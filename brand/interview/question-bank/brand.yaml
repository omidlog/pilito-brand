    module: brand-strategy
    field_path: brand.strategy.promise
    label: Brand promise
    prompt:
      en: What will you promise only if you can keep it?
      fa: چه وعده‌ای را فقط اگر بتوانید به آن عمل کنید می‌دهید؟
      tr: Yalnızca tutabileceğiniz bir söz varsa o nedir?
    why_it_matters: A promise is a public commitment. Unknown is safer than an empty superlative.
    question_type: long_text
