  - id: brand.logo.min_size
    module: logo-system
    field_path: brand.logo.min_size
    label: Minimum size and clear space
    prompt:
      en: What is the minimum on-screen logo size in px, and the clear space around it (px, or a multiple
        of the mark height such as 0.5x)? Optionally a minimum print size in mm. Answer unknown
        until a master exists.
      fa: کمترین اندازهٔ لوگو روی صفحه به px چقدر است و فضای خالی پیرامون آن چقدر (px یا ضریبی از ارتفاع
        نشانه، مثل 0.5x)؟ در صورت نیاز کمترین اندازهٔ چاپ به mm. تا وقتی فایل اصلی نیست، unknown.
      tr: Ekranda en küçük logo boyutu kaç px ve çevresindeki boşluk ne kadar (px veya işaret
        yüksekliğinin katı, ör. 0.5x)? İsterseniz mm cinsinden en küçük baskı boyutu. Ana dosya
        olana kadar unknown.
    why_it_matters: Favicon and print failures come from unstated minimums. The values become draft logo
      tokens after approval, but only once a master exists.
    question_type: logo_spec
    examples:
      - "EXAMPLE ONLY: min-size: 24px; clear-space: 0.5x; min-print: 10mm"
    required_when: always
    depends_on: []
    priority: high
    order: 82
    sensitivity: internal
