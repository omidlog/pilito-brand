      en: Which words, claims, or jokes are forbidden?
      fa: کدام واژه‌ها، ادعاها یا شوخی‌ها ممنوع‌اند؟
      tr: Hangi sözcükler, iddialar veya şakalar yasak?
    why_it_matters: Forbidden language is a review checklist, not a vibe.
