schema_version: 1
questions:
  - id: brand.personality.traits
    module: brand-strategy
    field_path: brand.personality.traits
    label: Personality
    prompt:
      en: Which personality traits should people feel from the brand, and which traits are out of bounds?
      fa: برند باید کدام ویژگی‌های شخصیتی را منتقل کند و کدام ویژگی‌ها خارج از محدوده‌اند؟
      tr: İnsanlar markadan hangi kişilik özelliklerini hissetmeli ve hangileri sınır dışıdır?
    why_it_matters: Voice, mascot behavior, and motion all inherit personality. A trait list without
      boundaries gets misused.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Calm and precise. Not sarcastic. This is only an illustration."
    suggestions:
      - Name three traits and one excluded trait
      - Defer with decide later if the offer is still moving
    required_when: always
    depends_on: []
    priority: critical
    order: 10
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: &a1
      - owner
      - approved_import
      - external_cited
      - agent_suggestion
    related_outputs:
      - brand/generated/drafts/brand-strategy.md
      - brand/generated/drafts/verbal-identity.md
      - brand/generated/drafts/mascot-identity.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.strategy.purpose
    module: brand-strategy
    field_path: brand.strategy.purpose
    label: Purpose
    prompt:
      en: Why does this brand exist beyond making a sale? Answer unknown if you have not decided.
      fa: این برند، فراتر از فروش، چرا وجود دارد؟ اگر تصمیم نگرفته‌اید، ناشناخته.
      tr: Bu marka satışın ötesinde neden var? Karar vermediyseniz bilinmiyor.
    why_it_matters: Purpose is a long-horizon strategy sentence, not a campaign headline.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Unknown. Too early to claim a social purpose."
    required_when: always
    depends_on: []
    priority: high
    order: 40
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
