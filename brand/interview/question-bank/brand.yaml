  - id: brand.logo.clear_space
    module: logo-system
    field_path: brand.logo.clear_space
    label: Clear space
    prompt:
      en: What clear-space rule should be used once a master exists? Answer TBD until then.
      fa: وقتی فایل اصلی وجود داشت، قاعدهٔ فضای خالی چیست؟ تا آن وقت TBD.
      tr: Ana dosya olunca boşluk kuralı ne olsun? O zamana kadar TBD.
    why_it_matters: A numeric clear space without a master is fake precision.
    question_type: long_text
