  - id: brand.strategy.differentiation
    module: brand-strategy
    field_path: brand.strategy.differentiation
    label: Differentiation
    prompt:
      en: How should people tell this offer apart from the alternatives they actually consider? Cite
        evidence or label a hypothesis.
      fa: مردم این پیشنهاد را از جایگزین‌هایی که واقعاً در نظر می‌گیرند چطور جدا کنند؟ شواهد بیاورید یا
        فرضیه برچسب بزنید.
      tr: İnsanlar bu teklifi gerçekten düşündükleri alternatiflerden nasıl ayırsın? Kanıt verin veya
        hipotez deyin.
    why_it_matters: Competitive frames without sources become false advertising.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Hypothesis: shorter sessions than a classroom. Not verified."
    required_when: always
    depends_on:
