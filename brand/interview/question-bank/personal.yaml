    module: personal-positioning
    field_path: personal.positioning.expertise
    label: Expertise topics
    prompt:
      en: Which topic clusters are you an expert in, and which of them can you demonstrate with work?
      fa: در کدام خوشه‌های موضوعی متخصص هستید و کدام را می‌توانید با کار نشان دهید؟
      tr: Hangi konu kümelerinde uzmansınız ve hangilerini işle gösterebilirsiniz?
    why_it_matters: Expertise without evidence is labeled unverified.
    question_type: long_text
