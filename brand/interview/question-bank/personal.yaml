  - id: personal.experience.relationships
    module: personal-career
    field_path: personal.experience.relationships
    label: Organizations and relationships
    prompt:
      en: Which organizations are you connected to? For each give relation | organization | from | to, and
        ownership only if you want to state it.
      fa: "با کدام سازمان‌ها ارتباط دارید؟ برای هرکدام: نوع رابطه | سازمان | از | تا، و مالکیت فقط اگر
        می‌خواهید بیان کنید."
      tr: Hangi kuruluşlarla bağlantınız var? Her biri için ilişki | kuruluş | başlangıç | bitiş ve
        yalnızca belirtmek isterseniz sahiplik.
    why_it_matters: A person can found, work at, or advise a company without owning it. The relation and
      dates make that explicit.
    question_type: relationships
    examples:
      - "EXAMPLE ONLY: employed | Example Corp | 2016 | 2020; advised | Example Labs | 2022 |
        present"
    required_when: always
