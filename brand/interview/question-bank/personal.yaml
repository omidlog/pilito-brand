    module: personal-story
    field_path: personal.story.next_chapter
    label: Next chapter (aspiration)
    prompt:
      en: What are you working toward next? This is labeled as an aspiration, not a fact.
      fa: به سمت چه چیزی کار می‌کنید؟ این آرمان برچسب می‌خورد، نه واقعیت.
      tr: Sırada neye doğru çalışıyorsunuz? Bu gerçek değil, hedef olarak etiketlenir.
