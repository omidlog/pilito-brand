      fa: چطور به این کار رسیدید؟ دو یا سه جمله با کلمات خودتان.
      tr: Bu işe nasıl geldiniz? Kendi sözlerinizle iki üç cümle.
    why_it_matters: The origin is the spine of a long bio. It is never invented.
