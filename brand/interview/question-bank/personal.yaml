    module: personal-positioning
    field_path: personal.positioning.primary_audience
    label: Primary audience
    prompt:
      en: "Who is your primary audience today: clients, employers, a community, peers or media?"
      fa: "مخاطب اصلی امروز شما کیست: مشتریان، کارفرمایان، یک جامعه، همکاران یا رسانه؟"
      tr: "Bugünkü birincil kitleniz kim: müşteriler, işverenler, bir topluluk, meslektaşlar veya medya?"
