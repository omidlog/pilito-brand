  - id: personal.positioning.perspective
    module: personal-positioning
    field_path: personal.positioning.perspective
    label: Point of view
    prompt:
      en: What do you believe about your field that others often get wrong?
      fa: دربارهٔ حوزهٔ کاری‌تان به چه چیزی باور دارید که دیگران اغلب اشتباه می‌کنند؟
      tr: Alanınız hakkında başkalarının sıkça yanlış bildiği neye inanıyorsunuz?
    why_it_matters: A point of view separates a person from a job title.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Most roadmaps fail because nobody wrote down what was decided."
    required_when: always
    depends_on: []
    priority: high
    order: 14
