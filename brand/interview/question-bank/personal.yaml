      fa: در نقش‌های اصلی‌تان مسئول چه بودید؟ سازمان را از فهرست روابط نام ببرید.
      tr: Ana rollerinizde neden sorumluydunuz? Kuruluşu ilişki listenizden adlandırın.
    why_it_matters: Responsibilities are what LinkedIn experience entries and case studies quote.
    question_type: long_text
