  - id: business.marketing.objective
    module: business-marketing
    field_path: business.marketing.objective
    label: Marketing objective
    prompt:
      en: What should marketing change in the next planning period?
      fa: بازاریابی در دورهٔ برنامه‌ریزی بعدی باید چه چیزی را تغییر دهد؟
      tr: Pazarlama bir sonraki plan döneminde neyi değiştirmeli?
    why_it_matters: Objectives come before channel shopping.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Learn whether the primary segment understands the offer. No growth target
        yet."
    required_when: always
    depends_on:
      - business.offer.value_proposition
    priority: high
    order: 120
    sensitivity: internal
