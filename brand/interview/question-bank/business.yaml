    sector_hints: []
    status: unanswered
  - id: business.marketing.pillars
    module: business-marketing
    field_path: business.marketing.pillars
    label: Content pillars
    prompt:
      en: What content pillars are approved enough to brief a writer? Leave TBD if none are.
      fa: کدام ستون‌های محتوا آن‌قدر روشن‌اند که بتوان برای نویسنده بریف نوشت؟ اگر هیچ، TBD بگذارید.
      tr: Bir yazara brief verecek kadar net içerik sütunları hangileri? Yoksa TBD bırakın.
    why_it_matters: Social and campaign templates inherit pillars instead of inventing themes.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: TBD — no pillar approved."
    required_when: always
    depends_on: []
    priority: high
    order: 123
    sensitivity: internal
