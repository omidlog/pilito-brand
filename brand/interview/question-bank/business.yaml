  - id: business.marketing.attribution
    module: business-marketing
    field_path: business.marketing.attribution
    label: Attribution
    prompt:
      en: Which attribution approach will you use, or is it undecided?
      fa: از کدام رویکرد نسبت‌دهی استفاده می‌کنید، یا هنوز تصمیم ندارید؟
      tr: Hangi ilişkilendirme yaklaşımını kullanacaksınız, yoksa kararsız mısınız?
    why_it_matters: Reporting rules have to be chosen before a dashboard is treated as truth.
    question_type: single_choice
    examples:
      - "EXAMPLE ONLY: Undecided. Do not imply last-click."
    options:
      - undecided
      - last-touch
      - first-touch
      - self-reported
      - modeled
      - not-applicable
    required_when: always
    depends_on: []
    priority: high
    order: 125
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
