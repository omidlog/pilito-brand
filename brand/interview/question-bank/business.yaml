  - id: business.marketing.budget
    module: business-marketing
    field_path: business.marketing.budget
    label: Channel budget
    prompt:
      en: What budget, currency, and period are approved for marketing? Use unknown if none is approved.
      fa: چه بودجه، واحد پول و دوره‌ای برای بازاریابی تأیید شده است؟ اگر نیست، ناشناخته.
      tr: Pazarlama için onaylı bütçe, para birimi ve dönem nedir? Yoksa bilinmiyor.
    why_it_matters: A budget claim without currency and dates is not usable, and it is sensitive.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Unknown. No approved spend."
    required_when: always
    depends_on: []
    priority: high
    order: 124
    sensitivity: restricted
    language:
      - en
      - fa
      - tr
