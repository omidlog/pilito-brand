    sector_hints: []
    status: unanswered
  - id: business.marketing.channels
    module: business-marketing
    field_path: business.marketing.channels
    label: Channels
    prompt:
      en: Which channels are actually in the current plan? Name the ones you are not doing as well.
      fa: در برنامهٔ فعلی کدام کانال‌ها واقعاً هستند؟ آن‌هایی را که انجام نمی‌دهید هم نام ببرید.
      tr: Güncel planda hangi kanallar var? Yapmadıklarınızı da söyleyin.
    why_it_matters: A plan that lists every channel is not a plan.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Only founder-written notes. No paid social."
    required_when: always
    depends_on: []
    priority: high
