    status: unanswered
  - id: business.marketing.journey
    module: business-marketing
    field_path: business.marketing.journey
    label: Journey hypothesis
    prompt:
      en: What is the current hypothesis for awareness, consideration, conversion, retention, and
        advocacy?
      fa: فرضیهٔ فعلی برای آگاهی، بررسی، تبدیل، نگهداشت و توصیه چیست؟
      tr: Farkındalık, değerlendirme, dönüşüm, elde tutma ve tavsiye için güncel hipotez nedir?
    why_it_matters: Funnels are hypotheses until measurement exists.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Unknown past awareness. Retention has not been measured."
    required_when: always
    depends_on: []
    priority: high
    order: 122
    sensitivity: internal
    language:
