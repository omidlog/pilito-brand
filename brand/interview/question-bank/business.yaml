    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: business.marketing.availability_claim
    module: business-marketing
    field_path: business.marketing.availability_claim
    label: Availability claims
    prompt:
      en: What may public marketing say about availability?
      fa: بازاریابی عمومی دربارهٔ در دسترس بودن چه می‌تواند بگوید؟
      tr: Herkese açık pazarlama, bulunurluk hakkında ne söyleyebilir?
    why_it_matters: This must stay consistent with product.public_status.
    question_type: single_choice
    examples:
      - "EXAMPLE ONLY: do-not-claim"
    options:
      - do-not-claim
      - coming-soon
      - available
    required_when: always
    depends_on:
      - business.product.public_status
    priority: high
    order: 126
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/business-marketing.md
    related_ids:
      - business.product.public_status
    completion_rule: one_of
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: business.marketing.utm
    module: business-marketing
    field_path: business.marketing.utm
    label: UTM taxonomy
    prompt:
      en: What naming rules should campaign URLs follow? Say none yet if you have not defined them.
      fa: نشانی‌های کمپین از چه قاعدهٔ نام‌گذاری پیروی کنند؟ اگر تعریف نشده، بگویید هنوز هیچ.
      tr: Kampanya adresleri hangi adlandırma kuralına uysun? Tanımlı değilse henüz yok deyin.
    why_it_matters: A shared taxonomy prevents every channel from inventing its own source names.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: none yet"
    required_when: always
    depends_on: []
