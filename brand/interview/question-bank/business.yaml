schema_version: 1
questions:
  - id: business.identity.new_or_existing
    module: business-company
    field_path: business.identity.new_or_existing
    label: New or existing business
    prompt:
      en: Is this a new venture or an existing business?
      fa: این یک کسب‌وکار تازه است یا کسب‌وکاری که از قبل وجود دارد؟
      tr: Bu yeni bir girişim mi, yoksa mevcut bir işletme mi?
    why_it_matters: Existing businesses should import evidence instead of rewriting history. New
      ventures should not be asked for historic metrics.
    question_type: single_choice
    examples:
      - "EXAMPLE ONLY: existing"
    options:
      - new
      - existing
    suggestions:
      - new
      - existing
    required_when: always
    depends_on: []
    priority: critical
    order: 1
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: &a1
      - owner
      - approved_import
      - external_cited
      - agent_suggestion
    related_outputs:
      - brand/generated/drafts/business-company.md
    related_ids: []
    completion_rule: one_of
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: business.identity.trade_name
    module: business-company
    field_path: business.identity.trade_name
    label: Trade name
    prompt:
      en: What public trade name should the brand use?
      fa: نام تجاری عمومی این برند چه باید باشد؟
      tr: Markanın kullanacağı ticari ad nedir?
    why_it_matters: The trade name is the canonical public name. Logo, domain, and copy all point here.
    question_type: short_text
    examples:
      - "EXAMPLE ONLY: Northwind Language Club"
    suggestions:
      - Keep the placeholder EXAMPLE Brand until you decide
      - Use the spoken name customers already use
    required_when: always
    depends_on: []
    priority: critical
    order: 2
    sensitivity: public
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/business-company.md
      - brand/generated/drafts/brand-strategy.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: business.identity.legal_name
    module: business-company
    field_path: business.identity.legal_name
    label: Legal name
    prompt:
      en: What is the legal entity name, if one exists yet?
      fa: اگر شخص حقوقی وجود دارد، نام قانونی آن چیست؟
      tr: Varsa tüzel kişiliğin yasal adı nedir?
    why_it_matters: Contracts and invoices use the legal name. It may differ from the trade name.
    question_type: short_text
    examples:
      - "EXAMPLE ONLY: Northwind Studio LLC"
    required_when: always
    depends_on:
      - business.identity.new_or_existing
    priority: high
    order: 20
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/business-company.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: false
    weight: 1
    sector_hints: []
    status: unanswered
  - id: business.identity.sector
    module: business-company
    field_path: business.identity.sector
    label: Sector
    prompt:
      en: Which sector best describes the business?
      fa: کدام بخش، این کسب‌وکار را بهتر توصیف می‌کند؟
      tr: İşletmeyi en iyi hangi sektör tanımlar?
    why_it_matters: Later questions adapt to the sector. Education, SaaS, agency, and nonprofit
      interviews are not the same.
    question_type: single_choice
    examples:
      - "EXAMPLE ONLY: education"
    options:
      - education
      - b2b-saas
      - ecommerce
      - services
      - agency
      - marketplace
      - consumer-app
      - nonprofit
      - physical-product
      - other
    required_when: always
    depends_on: []
    priority: critical
    order: 3
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/business-company.md
    related_ids: []
    completion_rule: one_of
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: business.offer.summary
    module: business-company
    field_path: business.offer.summary
    label: Offer
    prompt:
      en: What product or service do you sell, in one concrete description?
      fa: محصول یا خدمتی که می‌فروشید را در یک توضیح مشخص بگویید.
      tr: Sattığınız ürün veya hizmeti tek ve somut bir cümleyle anlatın.
    why_it_matters: Marketing, product, and sales all consume this offer record.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: A mobile practice app for people learning everyday conversation."
    required_when: always
    depends_on: []
    priority: critical
    order: 4
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/business-company.md
      - brand/generated/drafts/business-product.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: business.stage.current
    module: business-company
    field_path: business.stage.current
    label: Operating stage
    prompt:
      en: What operating stage is the business in?
      fa: کسب‌وکار در کدام مرحلهٔ عملیاتی است؟
      tr: İşletme hangi operasyon aşamasında?
    why_it_matters: Idea-stage and established companies should not be forced through the same evidence bar.
    question_type: single_choice
    examples:
      - "EXAMPLE ONLY: pre-revenue"
    options:
      - idea
      - pre-revenue
      - established
      - unknown
    required_when: always
    depends_on: []
    priority: critical
    order: 5
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/business-company.md
    related_ids: []
    completion_rule: one_of
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: business.market.geography
    module: business-company
    field_path: business.market.geography
    label: Geography
    prompt:
      en: Which countries or regions are in scope for the first release?
      fa: کشورها یا منطقه‌های نسخهٔ اول کدام‌اند؟
      tr: İlk sürüm hangi ülke veya bölgeleri kapsıyor?
    why_it_matters: Compliance, language, pricing, and support all depend on geography.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Turkey and Germany first; other markets undecided."
    required_when: always
    depends_on: []
    priority: critical
    order: 6
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/business-company.md
      - brand/generated/drafts/brand-strategy.md
      - brand/generated/drafts/business-legal.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: business.customer.primary_segment
    module: business-company
    field_path: business.customer.primary_segment
    label: Primary customer
    prompt:
      en: Who is the primary customer for this business?
      fa: مشتری اصلی این کسب‌وکار چه کسی است؟
      tr: Bu işletmenin birincil müşterisi kim?
    why_it_matters: Positioning, product requirements, marketing, and brand messaging depend on this.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: independent language learners aged 18–35"
    required_when: answers[business.stage.current] != unknown
    depends_on:
      - business.stage.current
    priority: critical
    order: 7
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/business-company.md
      - brand/generated/drafts/brand-strategy.md
      - brand/generated/drafts/business-marketing.md
    related_ids:
      - brand.personality.traits
      - business.product.jobs
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: business.offer.value_proposition
    module: business-company
    field_path: business.offer.value_proposition
    label: Value proposition
    prompt:
      en: What is the canonical value proposition, in the customer’s language?
      fa: ارزش پیشنهادی اصلی، به زبان مشتری، چیست؟
      tr: Temel değer önerisi, müşterinin dilinde nedir?
    why_it_matters: Approved positioning lives in one place. Ads and sales may only repeat this wording
      or an approved variant.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Short daily speaking practice without a classroom schedule."
    required_when: always
    depends_on: []
    priority: critical
    order: 9
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/business-company.md
      - brand/generated/drafts/brand-strategy.md
      - brand/generated/drafts/business-marketing.md
      - brand/generated/drafts/business-sales.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: business.problem.pains
    module: business-company
    field_path: business.problem.pains
    label: Customer pains
    prompt:
      en: Which customer pains has someone actually observed? Mark anything else as a hypothesis.
      fa: کدام دردهای مشتری واقعاً مشاهده شده‌اند؟ بقیه را فرضیه علامت بزنید.
      tr: Hangi müşteri acıları gerçekten gözlemlendi? Geri kalanı hipotez olarak işaretleyin.
    why_it_matters: A plan that treats a guess as research will mislead the brand and the roadmap.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Hypothesis only: learners abandon apps that feel like grammar textbooks."
    required_when: always
    depends_on:
      - business.customer.primary_segment
    priority: high
    order: 30
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/business-company.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: business.model.revenue
    module: business-company
    field_path: business.model.revenue
    label: Revenue model
    prompt:
      en: How do you expect the business to make money? Say unknown if it is not decided.
      fa: انتظار دارید کسب‌وکار چگونه درآمد بسازد؟ اگر مشخص نیست، ناشناخته بگویید.
      tr: İşletme nasıl gelir elde edecek? Karar yoksa bilinmiyor deyin.
    why_it_matters: Pricing, finance, and sales motions hang off this choice.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Undecided between a subscription and a paid cohort."
    required_when: always
    depends_on: []
    priority: high
    order: 31
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/business-company.md
      - brand/generated/drafts/business-sales.md
      - brand/generated/drafts/business-finance.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: business.model.defensibility
    module: business-company
    field_path: business.model.defensibility
    label: Defensibility
    prompt:
      en: What, if anything, would make this offer hard to copy? Use unknown rather than a slogan.
      fa: اگر چیزی کپی کردن این پیشنهاد را سخت می‌کند، آن چیست؟ به‌جای شعار، ناشناخته بگویید.
      tr: Bu teklifi kopyalamayı zorlaştıran bir şey var mı? Slogan yerine bilinmiyor deyin.
    why_it_matters: Investor and strategy narratives must not upgrade a hope into a moat.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Unknown. Distribution is not yet a moat."
    required_when: always
    depends_on: []
    priority: high
    order: 32
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/business-company.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: false
    weight: 1
    sector_hints: []
