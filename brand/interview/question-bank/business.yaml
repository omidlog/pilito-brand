  - id: business.plan.milestone
    module: business-company
    field_path: business.plan.milestone
    label: Next milestone
    prompt:
      en: What is the next milestone that would change how you operate?
      fa: مرحلهٔ بعدی که شیوهٔ کار شما را عوض می‌کند چیست؟
      tr: Çalışma biçiminizi değiştirecek sonraki kilometre taşı nedir?
    why_it_matters: Goals, hiring, and brand launches should point at a real milestone.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: A private beta with 20 learners who finish one week."
    required_when: always
    depends_on: []
    priority: high
    order: 33
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/business-company.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: business.plan.risks
    module: business-company
    field_path: business.plan.risks
    label: Top risks
    prompt:
      en: What are the top risks you already recognize?
      fa: مهم‌ترین ریسک‌هایی که از حالا می‌شناسید کدام‌اند؟
      tr: Şimdiden gördüğünüz başlıca riskler neler?
    why_it_matters: The risk register starts from owner-recognized risks, not a generic list.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: App-store rejection and unclear education regulations."
    required_when: always
    depends_on: []
    priority: high
    order: 34
    sensitivity: internal
