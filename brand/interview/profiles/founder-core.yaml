schema_version: 1
id: founder-core
title: Founder core
description: >-
  About 40 questions a founder can answer in one sitting. They cover identity, offer, customer,
  business model, verbal identity, and the visual basics that later generate draft tokens. Set
  brand.profile to founder-core in brand.config.yaml to use it; set it back to universal for the
  full question bank. Restricted finance questions are left out on purpose: an interviewing agent
  must not collect them, and the owner answers them in the interactive interview.
# Every dependency of a listed question is also listed, so no question is blocked by one outside the profile.
question_ids:
  # Identity and stage
  - business.identity.new_or_existing
  - business.identity.trade_name
  - business.identity.sector
  - business.stage.current
  - business.market.geography
  # Offer, customer, problem
  - business.offer.summary
  - business.customer.primary_segment
  - business.offer.value_proposition
  - business.problem.pains
  - business.product.mvp
  - business.product.public_status
  # Model and go-to-market
  - business.model.revenue
  - business.sales.motion
  - business.sales.buyer
  - business.sales.pricing
  - business.sales.b2b_packaging
  - business.marketing.objective
  - business.marketing.channels
  - business.plan.milestone
  - business.finance.currency
  # Strategy and personality
  - brand.personality.traits
  - brand.strategy.purpose
  - brand.strategy.values
  - brand.strategy.differentiation
  - brand.strategy.promise
  # Verbal identity
  - brand.verbal.name_use
  - brand.identity.public_name_override
  - brand.verbal.tagline
  - brand.verbal.voice
  - brand.verbal.forbidden
  - brand.verbal.localization
  - brand.verbal.voice_pairs
  # Visual basics. Color roles, type scale and logo size are structured answers that
  # brand:tokens:generate turns into draft tokens once they are approved.
  - brand.logo.variants
  - brand.logo.misuse
  - brand.logo.min_size
  - brand.color.roles
  - brand.color.themes
  - brand.type.intent
  - brand.type.scale
  # Optional modules
  - brand.mascot.enabled
  - brand.gamification.enabled
