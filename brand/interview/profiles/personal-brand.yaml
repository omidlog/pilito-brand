schema_version: 1
id: personal-brand
title: Personal brand
description: "A person-centered brand: identity, positioning, story, experience and credentials,
  evidence, content, visual presence and privacy, plus the shared voice and visual basics. Facet
  questions (founder-executive, consultant-expert, creator-educator, artist-designer,
  speaker-author) apply only for the facets selected in modules.personal.facets. The profile is
  exclusive: company legal-entity, SaaS, mascot and other Business OS questions count as not
  applicable, not missing. A person who also runs a business can set brand.profile back to universal
  and keep modules.personal enabled to work through both."
exclusive: true
