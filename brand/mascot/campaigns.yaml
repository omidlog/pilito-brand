    category: seasonal
    name: Birthday
    intent: Only when a real birthday moment is in scope and appropriate.
    emotion_intensity: medium
    pose: Same character, seasonal accent only. Costume must not break silhouette rules.
    face: Match the campaign emotion the owner approved.
    stage_compatibility:
      - any
    approved_angles: []
    applicable_surfaces:
      - marketing
      - social
    animation_possible: false
    source_assets: []
    preview: null
    status: defined
    do: &a1
      - Wait for an approved master tied to this id before using it in product or marketing.
      - Keep the pose readable at the smallest surface listed.
    dont: &a2
      - Do not generate artwork and mark this catalog row approved.
      - Do not borrow another brand’s character to fill the preview.
      - Do not use this state to claim a product feature that is unshipped.
    tags:
      - mascot
      - seasonal
      - birthday
      - backlog
