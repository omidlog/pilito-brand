states:
  - id: mascot.ui.welcome
    category: ui
    name: Welcome
    intent: First hello on a surface the product actually has.
    emotion_intensity: low
    pose: Leave room for UI controls. Do not cover the primary button.
    face: First hello on a surface the product actually has.
    stage_compatibility:
      - any
    approved_angles: []
    applicable_surfaces:
      - product
    animation_possible: true
    source_assets: []
    preview: null
    status: defined
    do: &a1
      - Wait for an approved master tied to this id before using it in product or marketing.
      - Keep the pose readable at the smallest surface listed.
    dont: &a2
      - Do not generate artwork and mark this catalog row approved.
      - Do not borrow another brand’s character to fill the preview.
      - Do not use this state to claim a product feature that is unshipped.
    tags:
      - mascot
      - ui
      - welcome
      - mvp
    version: 0.1.0
    owner: design
    mvp: true
    description: Welcome is a proposed ui slot. No approved artwork exists in the template.
    visual_brief: "EXAMPLE brief only: First hello on a surface the product actually has. Pose: Leave
      room for UI controls. Do not cover the primary button.. Face: First hello on a surface the
      product actually has.. Leave the drawing TBD."
    usage: "Product UI situation: Welcome."
